name: Integration Test Gate
run-name: Integration Test Gate initiated by @${{ github.actor }}

on:
  workflow_call:

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug

jobs:
  int_tests:
    name: Run API Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app-trail-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: './package.json'
          cache: 'npm'
          cache-dependency-path: './app-trail-playwright/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run API Tests
        id: api
        shell: bash
        run: |
          set -o pipefail
          npm run test:api 2>&1 | tee int-test-output.log

      - name: Summarize API Test Results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Integration Test Gate"
            echo ""
            echo "- Command: \`npm run test:api\` (\`playwright test --project=api\`)"
            echo "- Result: \`${{ steps.api.outcome }}\`"
            echo ""
            echo "<details><summary>Last 50 lines of output</summary>"
            echo ""
            echo '```'
            tail -n 50 int-test-output.log 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: int-test-results
          path: |
            app-trail-playwright/int-test-output.log
            app-trail-playwright/test-results/
          if-no-files-found: ignore
          retention-days: 3
